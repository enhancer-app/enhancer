name: Feature request
description: Suggest an idea for this project
title: "feature: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please search existing issues to make sure it hasn't already been suggested.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which platform is this feature for?
      options:
        - Twitch
        - Kick
        - Both
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: Describe the idea, expected behavior, and why it would be useful.
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Possible implementation
      description: Optional. Suggest how this could be implemented.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any related ideas, examples, screenshots, or related issues (e.g. `Closes #123`).
