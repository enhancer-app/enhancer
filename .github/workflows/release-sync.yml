name: Merge Sync PR

on:
  pull_request_target:
    types: [labeled, synchronize]
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-sync
  cancel-in-progress: false

jobs:
  describe-resolution:
    name: Show the manual conflict resolution
    if: >-
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.ref == 'sync-stable' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout master
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Comment the resolution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "$HEAD_SHA"
          git rev-parse -q --verify "$HEAD_SHA^2" >/dev/null || exit 0
          DIFF=$(git show --remerge-diff --format= --no-color "$HEAD_SHA" | head -c 60000)
          {
            echo "Manual conflict resolution in \`${HEAD_SHA:0:7}\`. This is everything changed by hand compared to git's automatic merge; review it before adding the \`merge-sync\` label."
            echo
            if [ -n "$DIFF" ]; then
              echo '```diff'
              echo "$DIFF"
              echo '```'
            else
              echo "Nothing was changed by hand."
            fi
          } > comment.md
          gh pr comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body-file comment.md

  merge-sync:
    name: Merge stable into master
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'merge-sync' &&
      github.event.pull_request.head.ref == 'sync-stable' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: release-sync
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Find sync PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            PR=$(gh pr list -R "$GITHUB_REPOSITORY" --head sync-stable --base master --state open \
              --json number,headRefOid,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0]')
            if [ -z "$PR" ] || [ "$PR" = "null" ]; then
              echo "No open sync PR."
              echo "found=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            {
              echo "found=true"
              echo "mode=auto"
              echo "number=$(jq -r .number <<< "$PR")"
              echo "sha=$(jq -r .headRefOid <<< "$PR")"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "found=true"
              echo "mode=label"
              echo "number=$EVENT_NUMBER"
              echo "sha=$EVENT_SHA"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Check permissions
        if: steps.pr.outputs.mode == 'label'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTORS: ${{ github.actor }} ${{ github.triggering_actor }}
        run: |
          for ACTOR in $ACTORS; do
            ROLE=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .role_name || true)
            if [ "$ROLE" != "admin" ] && [ "$ROLE" != "maintain" ]; then
              echo "::error::$ACTOR (${ROLE:-unknown}) cannot merge the sync PR."
              exit 1
            fi
          done

      - name: Checkout master
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Verify sync branch
        id: verify
        if: steps.pr.outputs.found == 'true'
        env:
          MODE: ${{ steps.pr.outputs.mode }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          reject() {
            if [ "$MODE" = "auto" ]; then
              echo "::notice::$1"
              echo "reason=$1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$1"
            exit 1
          }
          git fetch origin "$HEAD_SHA"
          STABLE=$(git rev-parse origin/stable)
          read -r _ FIRST SECOND EXTRA <<< "$(git rev-list --parents -n 1 "$HEAD_SHA")"
          if [ -z "$SECOND" ] || [ -n "$EXTRA" ]; then
            reject "sync-stable must end with a single merge of stable and master."
          fi
          if [ "$SECOND" = "$STABLE" ]; then OTHER=$FIRST
          elif [ "$FIRST" = "$STABLE" ]; then OTHER=$SECOND
          else reject "sync-stable does not merge the current stable."
          fi
          git merge-base --is-ancestor "$OTHER" origin/master || reject "sync-stable merges commits that are not on master."
          RESULT=$(git merge-tree --write-tree --no-messages origin/master "$HEAD_SHA") \
            || reject "sync-stable conflicts with master."

          if [ "$MODE" = "auto" ]; then
            PROVENANCE=$(bash .github/scripts/sync-provenance.sh origin/master origin/stable 2>&1) || reject "$PROVENANCE"
            [ "$(git diff --numstat origin/master "$RESULT")" = "$(printf '1\t1\tpackage.json')" ] \
              || reject "Merging sync-stable changes more than the version."
            VERSION_LINE='^[-+][[:space:]]*"version": "[0-9]+\.[0-9]+\.[0-9]+",$'
            [ "$(git diff -U0 --no-color origin/master "$RESULT" | grep -E '^[-+][^-+]' | grep -cE "$VERSION_LINE")" = 2 ] \
              || reject "Merging sync-stable changes more than the version."
            OLD=$(git show origin/master:package.json | jq -r .version)
            NEW=$(git cat-file -p "$RESULT:package.json" | jq -r .version)
            [ "$NEW" = "$(git show origin/stable:package.json | jq -r .version)" ] || reject "The version does not match stable."
            [ "$NEW" != "$OLD" ] && [ "$(printf '%s\n%s\n' "$OLD" "$NEW" | sort -V | tail -n 1)" = "$NEW" ] \
              || reject "Version $NEW is not newer than $OLD on master."
          elif EXPECTED=$(git merge-tree --write-tree --no-messages origin/master origin/stable); then
            [ "$RESULT" = "$EXPECTED" ] || reject "sync-stable changes more than merging stable into master would."
          else
            echo "::warning::stable conflicts with master, so the conflict resolution in sync-stable was merged as reviewed."
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Explain why it was not merged
        if: steps.verify.outputs.reason != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
          REASON: ${{ steps.verify.outputs.reason }}
        run: |
          gh pr comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body "This PR was not merged automatically: $REASON

          Review the branch, resolve it if needed, then add the \`merge-sync\` label."

      - name: Create App Token
        id: app-token
        if: steps.verify.outputs.ok == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Merge
        if: steps.verify.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/merge" \
            -f merge_method=merge -f sha="$HEAD_SHA" \
            -f commit_title="chore(sync): merge stable into master (#$NUMBER)"
