name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Type Check
            command: bun run typecheck
          - name: Tests
            command: bun test

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ".bun-version"

      - name: Cache Bun dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.bun/install/cache
          key: bun-deps-${{ hashFiles('bun.lock') }}
          restore-keys: bun-deps-

      - name: Install dependencies
        run: bun install --lockfile bun.lock

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  build:
    name: Build Project
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ".bun-version"

      - name: Cache Bun dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.bun/install/cache
          key: bun-deps-${{ hashFiles('bun.lock') }}
          restore-keys: bun-deps-

      - name: Install dependencies
        run: bun install --lockfile bun.lock

      - name: Build project
        run: bun run build
