name: Bump version

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  bump-version:
    name: Execute Bump
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/bump')

    steps:
      - name: Get PR Details
        uses: actions/github-script@v6
        id: get-branch
        with:
          github-token: ${{ secrets.ENHANCER_BOT_TOKEN }}
          result-encoding: string
          script: |
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            }
            const pr = await github.rest.pulls.get(request);
            return pr.data.head.ref;

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ENHANCER_BOT_TOKEN }}
          ref: ${{ steps.get-branch.outputs.result }}

      - name: Process Bump Command
        id: bump
        run: |
          COMMENT="${{ github.event.comment.body }}"
          TYPE=$(echo $COMMENT | awk '{print $2}') # gets 'patch', 'minor', or 'major'
          
          if [[ "$TYPE" != "patch" && "$TYPE" != "minor" && "$TYPE" != "major" ]]; then
             echo "Invalid bump type. Use patch, minor, or major."
             exit 1
          fi

          echo "Bumping $TYPE version..."
          
          CURRENT=$(jq -r .version manifest.json)
          
          IFS='.' read -r major minor patch <<< "$CURRENT"
          
          if [ "$TYPE" == "patch" ]; then patch=$((patch + 1)); fi
          if [ "$TYPE" == "minor" ]; then minor=$((minor + 1)); patch=0; fi
          if [ "$TYPE" == "major" ]; then major=$((major + 1)); minor=0; patch=0; fi
          
          NEW_VER="$major.$minor.$patch"
          
          jq --arg v "$NEW_VER" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          
          echo "BUMPED_VER=$NEW_VER" >> $GITHUB_OUTPUT

      - name: Commit and Push
        run: |
          git config --global user.name "Enhancer Bot"
          git config --global user.email "${{ secrets.ENHANCER_BOT_EMAIL }}"
          
          git add manifest.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.BUMPED_VER }}"
          git push origin HEAD

      - name: React to Comment
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.ENHANCER_BOT_TOKEN }}
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });