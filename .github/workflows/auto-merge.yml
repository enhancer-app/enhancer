name: Auto-Deploy (Hotfix/Release)

on:
  push:
    branches:
      - master

jobs:
  auto-release:
    name: Auto Release
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[hotfix]') || contains(github.event.head_commit.message, '[release]')

    steps:
      - name: Checkout Release Branch
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.ENHANCER_BOT_TOKEN }}

      - name: Merge Master into Release
        run: |
          git config --global user.name "Enhancer Bot"
          git config --global user.email "${{ secrets.ENHANCER_BOT_EMAIL }}"

          COMMIT_MSG="${{ github.event.head_commit.message }}"
          
          if [[ "$COMMIT_MSG" == *"[hotfix]"* ]]; then
             echo "🚨 Detected [hotfix] tag. Fast-tracking fix to release..."
          elif [[ "$COMMIT_MSG" == *"[release]"* ]]; then
             echo "📦 Detected [release] tag. Deploying new version to release..."
          fi

          git merge origin/master --no-edit

          git push origin release
          
          echo "✅ Successfully synced Master to Release branch!"