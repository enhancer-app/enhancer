name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom version tag (e.g., v5.1.26). Leave empty to use package.json.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-release:
    name: Build & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
      CLEAN_VER: ${{ steps.get_version.outputs.CLEAN_VER }}
      EXISTS: ${{ steps.check_tag.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Determine Version
        id: get_version
        env:
          MANUAL_TAG: ${{ inputs.custom_tag }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            RAW_VER=$MANUAL_TAG
          else
            echo "No manual tag. Reading package.json..."
            RAW_VER="v$(jq -r .version package.json)"
          fi

          if [[ ! "$RAW_VER" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version tag: $RAW_VER"
            exit 1
          fi
          
          if [[ $RAW_VER != v* ]]; then RAW_VER="v$RAW_VER"; fi
          CLEAN_VER=${RAW_VER#v}
          
          echo "VERSION=$RAW_VER" >> $GITHUB_OUTPUT
          echo "CLEAN_VER=$CLEAN_VER" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          git fetch --tags
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        if: steps.check_tag.outputs.exists == 'false'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ".bun-version"

      - name: Install & Pack
        if: steps.check_tag.outputs.exists == 'false'
        env:
          ENVIRONMENT: production
        run: |
          bun install
          bun run pack

      - name: Upload Artifacts
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-builds
          path: dist/

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/build-${{ steps.get_version.outputs.CLEAN_VER }}.zip
            dist/source-${{ steps.get_version.outputs.CLEAN_VER }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  approve-release:
    name: Approve Publishing
    needs: build-release
    if: needs.build-release.outputs.EXISTS == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: release
    steps:
      - run: echo "Manual approval received."

  publish-chrome:
    name: Publish Chrome
    needs: [build-release, approve-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: extension-builds
          path: dist

      - name: Publish to Chrome Web Store
        uses: mobilefirstllc/cws-publish@569e87bc9a54ad7712ba6dc154a110d88af63b85
        with:
          action: 'publish'
          client_id: ${{ secrets.CHROME_CLIENT_ID }}
          client_secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          extension_id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip_file: 'dist/build-${{ needs.build-release.outputs.CLEAN_VER }}.zip'

  publish-firefox:
    name: Publish Firefox
    needs: [build-release, approve-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: extension-builds
          path: dist

      - name: Publish to Firefox
        uses: wdzeng/firefox-addon@b78a4d0148897b072ef18aff65a6bd793e8109be
        with:
          addon-guid: ${{ secrets.FIREFOX_EXTENSION_ID }}
          xpi-path: 'dist/build-${{ needs.build-release.outputs.CLEAN_VER }}.zip'
          source-file-path: 'dist/source-${{ needs.build-release.outputs.CLEAN_VER }}.zip'
          jwt-issuer: ${{ secrets.AMO_JWT_ISSUER }}
          jwt-secret: ${{ secrets.AMO_JWT_SECRET }}
          self-hosted: false

  announce-discord:
    name: Announce Release on Discord
    needs: [build-release, publish-chrome, publish-firefox]
    if: needs.build-release.outputs.EXISTS == 'false' && needs.publish-chrome.result == 'success' && needs.publish-firefox.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate and send changelog
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          LLM_GATEWAY_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY }}
          LLM_GATEWAY_MODEL: ${{ vars.LLM_GATEWAY_MODEL }}
          VERSION: ${{ needs.build-release.outputs.VERSION }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const requiredEnv = [
              "DISCORD_CHANGELOG_WEBHOOK",
              "LLM_GATEWAY_API_KEY",
              "LLM_GATEWAY_MODEL",
            ];

            for (const name of requiredEnv) {
              if (!process.env[name]) {
                core.setFailed(`Missing required environment variable: ${name}`);
                return;
              }
            }

            core.setSecret(process.env.DISCORD_CHANGELOG_WEBHOOK);
            core.setSecret(process.env.LLM_GATEWAY_API_KEY);

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: process.env.VERSION,
            });
            const releaseNotes = release.data.body?.trim() || "No detailed release notes were provided.";
            const prompt = [
              "Write the changelog in English.",
              "Include only changes that regular users need to know about.",
              "Use natural, plain language and avoid technical implementation details.",
              "Do not invent information, mention this instruction, or add an introduction.",
              "Return only short markdown bullet points, with one change per bullet.",
              "The final message will use exactly this format:",
              `**Changelog ${process.env.VERSION}**`,
              "",
              "- Clear user-facing change",
              "- Another user-facing change",
              "Do not include the Changelog heading in your response; the workflow adds it.",
              "",
              "Maximum length for the bullet points: 1700 characters.",
              "",
              "Release notes:",
              "---",
              releaseNotes,
              "---",
            ].join("\n");

            let summary = `**Changelog ${process.env.VERSION}**\n\n${releaseNotes}`;
            const llmResponse = await fetch("https://api.llmgateway.io/v1/chat/completions", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.LLM_GATEWAY_API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                model: process.env.LLM_GATEWAY_MODEL,
                messages: [
                  {
                    role: "system",
                    content: "You write software changelogs for end users.",
                  },
                  { role: "user", content: prompt },
                ],
                temperature: 0.2,
                max_tokens: 500,
                stream: false,
              }),
            });

            if (llmResponse.ok) {
              const completion = await llmResponse.json();
              const generatedSummary = completion.choices?.[0]?.message?.content?.trim();

              if (generatedSummary) {
                const generatedBullets = generatedSummary.replace(/^\s*\*\*Changelog[^*]*\*\*\s*/i, "").trim();
                summary = `**Changelog ${process.env.VERSION}**\n\n${generatedBullets}`;
              } else {
                core.warning("LLM Gateway returned an empty summary. Using raw release notes.");
              }
            } else {
              core.warning(`LLM Gateway request failed with status ${llmResponse.status}. Using raw release notes.`);
            }

            const maxMessageLength = 2000;
            if (summary.length > maxMessageLength) {
              summary = `${summary.slice(0, maxMessageLength - 3)}...`;
            }

            const discordResponse = await fetch(process.env.DISCORD_CHANGELOG_WEBHOOK, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: "Enhancer Releases",
                allowed_mentions: { parse: [] },
                content: summary,
              }),
            });

            if (!discordResponse.ok) {
              throw new Error(`Discord webhook failed with status ${discordResponse.status}.`);
            }
