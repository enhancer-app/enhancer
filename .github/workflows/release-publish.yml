name: Release

on:
  push:
    branches:
      - master
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom version tag (e.g., v5.1.26). Leave empty to use package.json.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
      CLEAN_VER: ${{ steps.get_version.outputs.CLEAN_VER }}
      PUBLISH: ${{ steps.check_release.outputs.publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine Version
        id: get_version
        env:
          MANUAL_TAG: ${{ inputs.custom_tag }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            RAW_VER=$MANUAL_TAG
          else
            echo "No manual tag. Reading package.json..."
            RAW_VER="v$(jq -r .version package.json)"
          fi

          if [[ ! "$RAW_VER" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version tag: $RAW_VER"
            exit 1
          fi
          
          if [[ $RAW_VER != v* ]]; then RAW_VER="v$RAW_VER"; fi
          CLEAN_VER=${RAW_VER#v}
          
          echo "VERSION=$RAW_VER" >> $GITHUB_OUTPUT
          echo "CLEAN_VER=$CLEAN_VER" >> $GITHUB_OUTPUT

      - name: Check release
        id: check_release
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          CLEAN_VER: ${{ steps.get_version.outputs.CLEAN_VER }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            BUILD_ZIP="build-${CLEAN_VER}.zip"
            SOURCE_ZIP="source-${CLEAN_VER}.zip"
            if gh release view "$VERSION" --json assets \
              --jq -e --arg b "$BUILD_ZIP" --arg s "$SOURCE_ZIP" \
              '.assets | map(.name) | contains([$b, $s])' >/dev/null 2>&1; then
              echo "Release $VERSION already complete. Skipping."
              echo "publish=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "::error::Tag $VERSION already exists and tags are immutable. Bump the version to cut a new release; incomplete releases are never reused."
            exit 1
          fi

          if [ "$EVENT_NAME" != "push" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          PREV_VER=$(git show HEAD^:package.json | jq -r .version)
          if [ "$PREV_VER" == "$CLEAN_VER" ]; then
            echo "Version unchanged ($CLEAN_VER). Skipping."
            echo "publish=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD)
          if [ "$CHANGED_FILES" != "package.json" ]; then
            echo "::error::Release commit must change only package.json. Changed files: $CHANGED_FILES"
            exit 1
          fi

          RELEASE_PRS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "[.[] | select(.merged_at != null and .head.ref == \"release-next\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\")] | length")
          if [ "$RELEASE_PRS" -lt 1 ]; then
            echo "::error::Version change did not come from the release-next PR."
            exit 1
          fi

          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          HIGHEST=$(printf '%s\n%s\n' "${LATEST_TAG#v}" "$CLEAN_VER" | sort -V | tail -n1)
          if [ -n "$LATEST_TAG" ] && [ "$HIGHEST" != "$CLEAN_VER" ]; then
            echo "::error::Version $CLEAN_VER is lower than the latest tag $LATEST_TAG."
            exit 1
          fi

          echo "publish=true" >> $GITHUB_OUTPUT

      - name: Setup Bun
        if: steps.check_release.outputs.publish == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ".bun-version"

      - name: Install & Pack
        if: steps.check_release.outputs.publish == 'true'
        env:
          ENVIRONMENT: production
        run: |
          bun install
          bun run pack

      - name: Upload Artifacts
        if: steps.check_release.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-builds
          path: dist/

      - name: Create GitHub Release
        if: steps.check_release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          CLEAN_VER: ${{ steps.get_version.outputs.CLEAN_VER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          BUILD_ZIP="dist/build-${CLEAN_VER}.zip"
          SOURCE_ZIP="dist/source-${CLEAN_VER}.zip"
          for f in "$BUILD_ZIP" "$SOURCE_ZIP"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing asset: $f. Did 'bun run pack' succeed?"
              exit 1
            fi
          done
          ATTEMPT=0
          until [ "$ATTEMPT" -ge 3 ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Creating release $VERSION (attempt $ATTEMPT/3)..."
            if gh release create "$VERSION" --target "$TARGET_SHA" \
              --title "Release $VERSION" --generate-notes "$BUILD_ZIP" "$SOURCE_ZIP"; then
              break
            fi
            echo "::warning::Release create/upload failed (attempt $ATTEMPT/3). Cleaning up tag."
            gh release delete "$VERSION" --yes --cleanup-tag || true
            if [ "$ATTEMPT" -ge 3 ]; then
              echo "::error::Failed to create release $VERSION with assets after 3 attempts. Tag was cleaned up."
              exit 1
            fi
            sleep 5
          done
          COUNT=$(gh release view "$VERSION" --json assets --jq '.assets | length')
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::Release $VERSION is missing assets (found $COUNT, expected 2). Cleaning up tag."
            gh release delete "$VERSION" --yes --cleanup-tag || true
            exit 1
          fi

  publish-chrome:
    name: Publish Chrome
    needs: build-release
    if: needs.build-release.outputs.PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: extension-builds
          path: dist

      - name: Publish to Chrome Web Store
        uses: wdzeng/chrome-extension@37f4f9cdc664959bafef36b1f4da03dec5141620
        with:
          action: 'publish'
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip-path: 'dist/build-${{ needs.build-release.outputs.CLEAN_VER }}.zip'

  publish-firefox:
    name: Publish Firefox
    needs: build-release
    if: needs.build-release.outputs.PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: extension-builds
          path: dist

      - name: Publish to Firefox
        uses: wdzeng/firefox-addon@b78a4d0148897b072ef18aff65a6bd793e8109be
        with:
          addon-guid: ${{ secrets.FIREFOX_EXTENSION_ID }}
          xpi-path: 'dist/build-${{ needs.build-release.outputs.CLEAN_VER }}.zip'
          source-file-path: 'dist/source-${{ needs.build-release.outputs.CLEAN_VER }}.zip'
          jwt-issuer: ${{ secrets.AMO_JWT_ISSUER }}
          jwt-secret: ${{ secrets.AMO_JWT_SECRET }}
          self-hosted: false

  announce-discord:
    name: Announce Release on Discord
    needs: [build-release, publish-chrome, publish-firefox]
    if: needs.build-release.outputs.PUBLISH == 'true' && needs.publish-chrome.result == 'success' && needs.publish-firefox.result == 'success'
    runs-on: ubuntu-latest
    environment: release-announce
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Generate and send changelog
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          LLM_GATEWAY_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY }}
          LLM_GATEWAY_MODEL: ${{ vars.LLM_GATEWAY_MODEL }}
          VERSION: ${{ needs.build-release.outputs.VERSION }}
        with:
          script: |
            const run = require("./.github/scripts/announce-discord.cjs");
            await run({ github, context, core });
