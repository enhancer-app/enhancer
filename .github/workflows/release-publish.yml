name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom version tag (e.g., v5.1.26). Leave empty to use package.json.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-release:
    name: Build & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
      CLEAN_VER: ${{ steps.get_version.outputs.CLEAN_VER }}
      EXISTS: ${{ steps.check_tag.outputs.exists }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Determine Version
        id: get_version
        env:
          MANUAL_TAG: ${{ inputs.custom_tag }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            RAW_VER=$MANUAL_TAG
          else
            echo "No manual tag. Reading package.json..."
            RAW_VER="v$(jq -r .version package.json)"
          fi

          if [[ ! "$RAW_VER" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version tag: $RAW_VER"
            exit 1
          fi
          
          if [[ $RAW_VER != v* ]]; then RAW_VER="v$RAW_VER"; fi
          CLEAN_VER=${RAW_VER#v}
          
          echo "VERSION=$RAW_VER" >> $GITHUB_OUTPUT
          echo "CLEAN_VER=$CLEAN_VER" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          git fetch --tags
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun
        if: steps.check_tag.outputs.exists == 'false'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ".bun-version"

      - name: Install & Pack
        if: steps.check_tag.outputs.exists == 'false'
        env:
          ENVIRONMENT: production
        run: |
          bun install
          bun run pack

      - name: Upload Artifacts
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-builds
          path: dist/

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            dist/build-${{ steps.get_version.outputs.CLEAN_VER }}.zip
            dist/source-${{ steps.get_version.outputs.CLEAN_VER }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  approve-release:
    name: Approve Publishing
    needs: build-release
    if: needs.build-release.outputs.EXISTS == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: release
    steps:
      - run: echo "Manual approval received."

  publish-chrome:
    name: Publish Chrome
    needs: [build-release, approve-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: extension-builds
          path: dist

      - name: Publish to Chrome Web Store
        uses: mobilefirstllc/cws-publish@569e87bc9a54ad7712ba6dc154a110d88af63b85
        with:
          action: 'publish'
          client_id: ${{ secrets.CHROME_CLIENT_ID }}
          client_secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh_token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          extension_id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip_file: 'dist/build-${{ needs.build-release.outputs.CLEAN_VER }}.zip'

  publish-firefox:
    name: Publish Firefox
    needs: [build-release, approve-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: extension-builds
          path: dist

      - name: Publish to Firefox
        uses: wdzeng/firefox-addon@b78a4d0148897b072ef18aff65a6bd793e8109be
        with:
          addon-guid: ${{ secrets.FIREFOX_EXTENSION_ID }}
          xpi-path: 'dist/build-${{ needs.build-release.outputs.CLEAN_VER }}.zip'
          source-file-path: 'dist/source-${{ needs.build-release.outputs.CLEAN_VER }}.zip'
          jwt-issuer: ${{ secrets.AMO_JWT_ISSUER }}
          jwt-secret: ${{ secrets.AMO_JWT_SECRET }}
          self-hosted: false
