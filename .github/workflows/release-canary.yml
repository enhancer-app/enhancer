name: Release Canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-canary
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & GitHub Pre-release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine Version
        id: get_version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="$(jq -r .version package.json).$RUN_NUMBER"
          if git rev-parse "canary-$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag canary-$VERSION already exists."
            exit 1
          fi
          PREVIOUS_TAG=$(git tag --list 'canary-*' --sort=-v:refname | head -n1)
          if [ -z "$PREVIOUS_TAG" ]; then PREVIOUS_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1); fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ".bun-version"

      - name: Install & Pack
        env:
          ENVIRONMENT: production
          CHANNEL: canary
          CANARY_BUILD: ${{ github.run_number }}
          CANARY_COMMIT: ${{ github.sha }}
        run: |
          bun install
          bun run pack

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-builds
          path: dist/

      - name: Generate Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          PREVIOUS_TAG: ${{ steps.get_version.outputs.PREVIOUS_TAG }}
        run: |
          ARGS=(-f "tag_name=canary-$VERSION" -f "target_commitish=$GITHUB_SHA")
          if [ -n "$PREVIOUS_TAG" ]; then ARGS+=(-f "previous_tag_name=$PREVIOUS_TAG"); fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" --jq .body > release-notes.md

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          tag_name: canary-${{ steps.get_version.outputs.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Canary ${{ steps.get_version.outputs.VERSION }}
          body_path: release-notes.md
          prerelease: true
          make_latest: false
          files: |
            dist/build-${{ steps.get_version.outputs.VERSION }}.zip
            dist/source-${{ steps.get_version.outputs.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-chrome:
    name: Publish Chrome
    needs: build-release
    runs-on: ubuntu-latest
    environment: release-canary
    permissions:
      contents: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: extension-builds
          path: dist

      - name: Publish to Chrome Web Store
        uses: wdzeng/chrome-extension@37f4f9cdc664959bafef36b1f4da03dec5141620
        with:
          action: 'publish'
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          zip-path: 'dist/build-${{ needs.build-release.outputs.VERSION }}.zip'

  publish-firefox:
    name: Publish Firefox
    needs: build-release
    runs-on: ubuntu-latest
    environment: release-canary
    permissions:
      contents: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: extension-builds
          path: dist

      - name: Publish to Firefox
        uses: wdzeng/firefox-addon@b78a4d0148897b072ef18aff65a6bd793e8109be
        with:
          addon-guid: ${{ secrets.FIREFOX_EXTENSION_ID }}
          xpi-path: 'dist/build-${{ needs.build-release.outputs.VERSION }}.zip'
          source-file-path: 'dist/source-${{ needs.build-release.outputs.VERSION }}.zip'
          jwt-issuer: ${{ secrets.AMO_JWT_ISSUER }}
          jwt-secret: ${{ secrets.AMO_JWT_SECRET }}
          self-hosted: false
