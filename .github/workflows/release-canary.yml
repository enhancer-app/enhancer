name: Release Canary

on:
  push:
    branches:
      - canary
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-canary
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & GitHub Pre-release
    if: github.ref == 'refs/heads/canary'
    runs-on: ubuntu-latest
    environment: release-bot
    permissions:
      contents: read
      pull-requests: read
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
      PREVIOUS_TAG: ${{ steps.get_version.outputs.PREVIOUS_TAG }}
    steps:
      - name: Check who started the run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTORS: ${{ github.actor }} ${{ github.triggering_actor }}
        run: |
          for ACTOR in $ACTORS; do
            ROLE=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .role_name || true)
            if [ "$ROLE" != "admin" ] && [ "$ROLE" != "maintain" ]; then
              echo "::error::$ACTOR (${ROLE:-unknown}) cannot start a release by hand."
              exit 1
            fi
          done
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine Version
        id: get_version
        run: |
          LAST_BUILD=$(git tag --list 'canary-*' | awk -F. '{print $NF}' | sort -n | tail -n1)
          BUILD=$(( ${LAST_BUILD:-0} + 1 ))
          VERSION="$(jq -r .version package.json).$BUILD"
          if [ -n "$LAST_BUILD" ]; then
            PREVIOUS_TAG=$(git tag --list "canary-*.$LAST_BUILD" | head -n1)
          else
            PREVIOUS_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          fi
          echo "BUILD=$BUILD" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: ".bun-version"

      - name: Install & Pack
        env:
          ENVIRONMENT: production
          CHANNEL: canary
          CANARY_BUILD: ${{ steps.get_version.outputs.BUILD }}
          CANARY_COMMIT: ${{ github.sha }}
        run: |
          bun install
          bun run pack

      - name: Upload Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extension-builds
          path: dist/

      - name: Write release notes
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        env:
          PREVIOUS_TAG: ${{ steps.get_version.outputs.PREVIOUS_TAG }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          TARGET_SHA: ${{ github.sha }}
        with:
          script: |
            const { collectChanges, formatNotes } = require("./.github/scripts/release-changes.cjs");
            const { PREVIOUS_TAG: fromTag, VERSION: version, TARGET_SHA: to } = process.env;
            const changes = fromTag ? await collectChanges({ github, context, from: fromTag, to, followPicks: false }) : [];
            const notes = formatNotes({ changes, context, fromTag, toTag: `canary-${version}` });
            require("node:fs").writeFileSync("release-notes.md", notes);

      - name: Create App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create GitHub Pre-release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release create "canary-$VERSION" --target "$TARGET_SHA" --title "Canary $VERSION" \
            --prerelease --latest=false --notes-file release-notes.md \
            "dist/build-$VERSION.zip" "dist/build-chrome-$VERSION.zip" "dist/source-$VERSION.zip"

  publish-chrome:
    name: Publish Chrome
    needs: build-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: extension-builds
          path: dist

      - name: Publish to Chrome Web Store
        uses: wdzeng/chrome-extension@37f4f9cdc664959bafef36b1f4da03dec5141620
        with:
          action: 'publish'
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          extension-id: lppdfejgfeffohjlllmkahfkoplnpmai
          zip-path: 'dist/build-chrome-${{ needs.build-release.outputs.VERSION }}.zip'

  publish-firefox:
    name: Publish Firefox
    needs: build-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: extension-builds
          path: dist

      - name: Publish to Firefox
        uses: wdzeng/firefox-addon@b78a4d0148897b072ef18aff65a6bd793e8109be
        with:
          addon-guid: "{e3cd2c48-15da-4b9f-b5a1-10f867857b5a}"
          xpi-path: 'dist/build-${{ needs.build-release.outputs.VERSION }}.zip'
          source-file-path: 'dist/source-${{ needs.build-release.outputs.VERSION }}.zip'
          jwt-issuer: ${{ secrets.AMO_JWT_ISSUER }}
          jwt-secret: ${{ secrets.AMO_JWT_SECRET }}
          self-hosted: false

  announce-discord:
    name: Announce Canary on Discord
    needs: [build-release, publish-chrome, publish-firefox]
    if: needs.publish-chrome.result == 'success' && needs.publish-firefox.result == 'success'
    runs-on: ubuntu-latest
    environment: release-announce-canary
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Generate and send changelog
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        env:
          DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          LLM_GATEWAY_API_KEY: ${{ secrets.LLM_GATEWAY_API_KEY }}
          LLM_GATEWAY_MODEL: ${{ vars.LLM_GATEWAY_MODEL }}
          VERSION: ${{ needs.build-release.outputs.VERSION }}
          TAG: canary-${{ needs.build-release.outputs.VERSION }}
          PREVIOUS_TAG: ${{ needs.build-release.outputs.PREVIOUS_TAG }}
          CHANNEL: canary
        with:
          script: |
            const run = require("./.github/scripts/announce-discord.cjs");
            await run({ github, context, core });
