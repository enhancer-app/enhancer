name: Check extension version

on:
  pull_request:
    branches:
      - release
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  check-version:
    name: Check extension version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Check for version change
        id: check
        run: |
          NEW_VER=$(jq -r .version manifest.json)
          
          git fetch origin release:release
          OLD_VER=$(git show release:manifest.json | jq -r .version)
          
          echo "PR Version: $NEW_VER"
          echo "Release Version: $OLD_VER"

          if [ "$NEW_VER" == "$OLD_VER" ]; then
             echo "changed=false" >> $GITHUB_OUTPUT
             echo "curr_ver=$OLD_VER" >> $GITHUB_OUTPUT
          else
             echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Send version change comment
        if: steps.check.outputs.changed == 'false'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.ENHANCER_BOT_TOKEN }}
          script: |
            const ver = '${{ steps.check.outputs.curr_ver }}';
            const body = `### ⚠️ Version Bump Required
            
            The \`manifest.json\` version is still **${ver}**. You cannot merge to Release without a new version number.
            
            **I can fix it for you!** Reply to this comment with one of these commands:
            * \`/bump patch\` (Fixes: 1.0.0 -> 1.0.1)
            * \`/bump minor\` (Features: 1.0.0 -> 1.1.0)
            * \`/bump major\` (Breaking: 1.0.0 -> 2.0.0)`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            })