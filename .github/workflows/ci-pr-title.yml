name: CI

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: write
  contents: read

jobs:
  validate-title:
    name: Validate Pull Request Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        id: lint_pr_title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            bugfix
            chore
            docs
            style
            refactor
            perf
            test
            ci
            release
          requireScope: false
          ignoreLabels: |
            ignore-semantic-pull-request

      - name: Send or Update Invalid Title Comment
        if: failure()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: pr-title-lint-error
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ### ❌ Invalid PR Title
            
            Your current title does not follow the required semantic format.
            
            **Example format:** `feat: add login functionality`
            **Allowed types:** feat, fix, bugfix, chore, docs, style, refactor, perf, test, ci, release

      - name: Delete Invalid Title Comment
        if: success()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: pr-title-lint-error
          delete: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  require-changeset:
    name: Require Changeset
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check for a changeset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! [[ "$TITLE" =~ ^(feat|fix|bugfix|perf)(\([^\)]*\))?!?: ]]; then
            echo "A ${TITLE%%:*} PR needs no changeset."
            exit 0
          fi
          FILES=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" \
            --jq '.[] | select(.status == "added") | .filename')
          if grep -E '^\.changeset/[^/]+\.md$' <<< "$FILES" | grep -qvx '.changeset/README.md'; then
            echo "Changeset found."
            exit 0
          fi
          echo "::error::Add a changeset with 'bunx changeset' (or 'bunx changeset --empty' when users will not notice the change). See .changeset/README.md."
          exit 1
